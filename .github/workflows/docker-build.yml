name: Docker build
"on":
  push:
    branches:
      - master
    tags:
      - "[0-9.]+"
  pull_request:
    branches:
      - master
jobs:
  docker-build:
    name: Build Docker image (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - slim
          - distroless
          - pm2
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' }}
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ matrix.target == 'slim' && github.event_name == 'push' }}
          # The Dockerfile downloads the sources from GitHub, so pin the exact commit under test
          build-args: |
            DOWNLOAD=${{ github.event.pull_request.head.sha || github.sha }}
          tags: |
            ${{ matrix.target == 'slim' && github.event_name == 'pull_request' && 'telefonicaid/iotagent-json:ci' || matrix.target == 'slim' && github.ref == 'refs/heads/master' && 'telefonicaid/iotagent-json:latest' || '' }}
            ${{ matrix.target == 'slim' && startsWith(github.ref, 'refs/tags/') && format('telefonicaid/iotagent-json:{0}', github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
